workspaces:
- name: client
  checkouts:
  - path: hello
    manifest:
      overlays:
      - name: client
        inline:
          hooks:
            post-checkout:
              cmd: |
                set -e
                # Replace with your mirror's INTERNAL endpoint host
                # (cs sandbox show mirror -> the *.sandboxes.internal URL).
                MIRROR_HOST="__MIRROR_HOST__"
                curl -k -fsSL "https://${MIRROR_HOST}/hello.tar.gz" | tar -zx
                git config --global --add safe.directory /home/owner/hello || true
                git checkout -f master
                git pull --ff-only || true
